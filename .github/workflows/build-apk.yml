name: Build and Publish Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Output
        run: |
          ls -la android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk ./birthday-wishes-debug.apk

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: birthday-wishes-debug-apk
          path: ./birthday-wishes-debug.apk
          retention-days: 30

      - name: Publish Debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "Birthday Wishes Mobile App v1.0.0 (Debug APK)"
          body: |
            ### 🎂 Birthday Wishes Mobile App (Debug APK)
            
            This release contains the latest debug APK for the **Birthday Wishes** mobile app.
            
            #### 📱 How to install on your Android device:
            1. Download `birthday-wishes-debug.apk` directly on your Android phone.
            2. Open the downloaded file.
            3. If prompted, enable **"Install from unknown sources"** or **"Allow from this source"**.
            4. Tap **Install** and launch **Birthday Wishes**! 🎉
            
            #### ✨ Features:
            - Festive confetti animations & celebration effects
            - Interactive 3D birthday cake with blow-out candle
            - Offline synthesized birthday melody chime
            - In-app card customization modal & URL parameter support
          files: ./birthday-wishes-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
